name: Builds and prereleases
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - name: Install the Windows SDK
        run: |
          mapfile -t packages < <(tr -d '\r' < native/windows/packages.txt)
          for attempt in 1 2 3; do
            if pacman -S --needed --noconfirm "${packages[@]}"; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            echo "SDK download failed; retrying in five seconds (attempt $attempt/3)."
            sleep 5
          done
      - name: Test packaging logic
        run: python -m unittest discover -s scripts/tests -v
      - name: Build and package
        run: bash scripts/build-windows.sh
      - name: Test the portable package without the SDK
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "Starship portable 🛰"
          Expand-Archive dist/Starship-Journal-windows-x64.zip $destination
          ./scripts/check-windows.ps1 -PackagePath "$destination/Starship-Journal-windows-x64"
      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: Starship-Journal-windows-x64
          path: dist/Starship-Journal-windows-x64.zip
          if-no-files-found: error
      - name: Upload UI previews and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-UI-previews
          path: target/windows-smoke-tests/
          if-no-files-found: ignore
  linux:
    name: Linux x86_64 packages
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Linux SDK
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config python3 \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-tools-dev-tools libjxl-dev \
            qml6-module-org-kde-kirigami qml6-module-org-kde-breeze qml6-module-qtqml-workerscript \
            qml6-module-qtqml-models qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-shapes \
            qml6-module-qtquick-window qml6-module-qtquick-dialogs qt6-svg-dev qt6-image-formats-plugins \
            qt6-wayland breeze-icon-theme fonts-dejavu-core patchelf rpm zstd file libarchive-tools
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Build, package, and test Linux formats
        run: bash scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Starship-Journal-linux-x86_64
          path: dist/*
          if-no-files-found: error
      - name: Upload Linux diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Linux-UI-previews
          path: target/linux-smoke-tests/
          if-no-files-found: ignore
  macos:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install macOS SDK
        run: brew install cmake ninja pkgconf qtbase qtdeclarative qtsvg qtshadertools jpeg-xl
      - name: Build KDE runtime and macOS app
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Starship-Journal-macos-arm64
          path: dist/*
          if-no-files-found: error
      - name: Upload macOS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-UI-previews
          path: target/macos-smoke-tests/
          if-no-files-found: ignore
  prerelease:
    name: Publish commit prerelease
    needs: [build, linux, macos]
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: prerelease-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Starship-Journal-*
          path: dist
          merge-multiple: true
      - name: Publish tested platform packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-prerelease.sh
